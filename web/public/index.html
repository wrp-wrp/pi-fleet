<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi-fleet 控制台</title>
<style>
	:root {
		--bg: #0f1115;
		--panel: #171a21;
		--panel2: #1e222b;
		--border: #2a2f3a;
		--fg: #e6e9ef;
		--dim: #8a93a3;
		--accent: #5b9dff;
		--green: #4ecca3;
		--red: #e06c75;
		--yellow: #d9c97a;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
		background: var(--bg);
		color: var(--fg);
		height: 100vh;
		display: flex;
		flex-direction: column;
	}
	#topbar {
		padding: 10px 16px;
		background: var(--panel);
		border-bottom: 1px solid var(--border);
		font-weight: 600;
		display: flex;
		align-items: center;
		gap: 12px;
	}
	#topbar .logo { color: var(--accent); }
	#count { color: var(--dim); font-weight: 400; font-size: 13px; }
	#status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-left: auto; }
	#status-dot.online { background: var(--green); }
	#main { flex: 1; display: flex; overflow: hidden; }
	#sidebar {
		width: 240px;
		background: var(--panel);
		border-right: 1px solid var(--border);
		overflow-y: auto;
		padding: 8px;
	}
	.node {
		padding: 10px 12px;
		border-radius: 8px;
		cursor: pointer;
		margin-bottom: 4px;
		border: 1px solid transparent;
	}
	.node:hover { background: var(--panel2); }
	.node.active { background: var(--panel2); border-color: var(--accent); }
	.node .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
	.node .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
	.node .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
	#panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
	#placeholder { margin: auto; color: var(--dim); }
	.panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
	.panel-header .title { font-weight: 600; }
	.panel-header .sub { color: var(--dim); font-size: 12px; }
	#content { flex: 1; overflow-y: auto; padding: 16px; }
	.msg { margin-bottom: 14px; }
	.msg .role { font-size: 12px; color: var(--dim); margin-bottom: 3px; }
	.msg.user .role { color: var(--accent); }
	.msg.assistant .role { color: var(--green); }
	.msg.tool .role { color: var(--yellow); }
	.msg .body { white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.5; }
	.msg.tool .body { font-family: ui-monospace, monospace; font-size: 13px; color: var(--dim); }
	#inputbar { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); display: flex; gap: 8px; }
	#inputbar input { flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--fg); border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
	#inputbar input:focus { border-color: var(--accent); }
	#inputbar button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 16px; cursor: pointer; font-weight: 600; }
	#inputbar button:disabled { opacity: 0.5; cursor: not-allowed; }
	#inputbar button.secondary { background: var(--panel2); border: 1px solid var(--border); color: var(--fg); }
	.output { font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-word; background: var(--panel2); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
	.busy { color: var(--yellow); font-size: 13px; padding: 8px 0; }
	.err { color: var(--red); }
</style>
</head>
<body>
	<div id="topbar">
		<span class="logo">◈ pi-fleet</span>
		<span id="count">连接中…</span>
		<span id="status-dot"></span>
	</div>
	<div id="main">
		<div id="sidebar"><div id="nodes"></div></div>
		<div id="panel">
			<div id="placeholder">选一个节点开始</div>
		</div>
	</div>
	<script src="app.js"></script>
</body>
</html>
